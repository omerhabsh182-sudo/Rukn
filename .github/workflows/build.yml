name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q "*.zip"
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund && npm run build
        working-directory: RuknApp/web
      - run: cp -r RuknApp/web/dist/. RuknApp/android/app/src/main/assets/
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle assembleDebug
        working-directory: RuknApp/android
      - uses: actions/upload-artifact@v4
        with:
          name: Rukn-apk
          path: RuknApp/android/app/build/outputs/apk/debug/app-debug.apk
